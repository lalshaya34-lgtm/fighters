<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duck Evolution 3D</title>

<style>
    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #101820;
        font-family: Arial, sans-serif;
        color: white;
    }

    #game {
        position: fixed;
        inset: 0;
    }

    #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
    }

    #top {
        position: absolute;
        top: 15px;
        left: 15px;
        width: 310px;
        padding: 14px;
        border-radius: 14px;
        background: rgba(0,0,0,.65);
        backdrop-filter: blur(5px);
    }

    #name {
        font-size: 23px;
        font-weight: bold;
        margin-bottom: 7px;
    }

    .bar {
        height: 17px;
        background: #252525;
        border-radius: 10px;
        overflow: hidden;
        margin: 5px 0 10px;
    }

    #hpBar {
        width: 100%;
        height: 100%;
        background: #e74c3c;
        transition: width .15s;
    }

    #xpBar {
        width: 0%;
        height: 100%;
        background: #38d66b;
        transition: width .15s;
    }

    #stats {
        font-size: 14px;
        line-height: 1.6;
    }

    #controls {
        position: absolute;
        bottom: 15px;
        left: 15px;
        padding: 10px 14px;
        background: rgba(0,0,0,.55);
        border-radius: 10px;
        font-size: 13px;
    }

    #message {
        position: absolute;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        padding: 10px 18px;
        background: rgba(0,0,0,.7);
        border-radius: 20px;
        font-weight: bold;
        opacity: 0;
        transition: opacity .2s;
    }

    #crosshair {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        font-size: 25px;
        color: white;
        text-shadow: 0 0 5px black;
    }

    #evolutionScreen {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(4,8,12,.82);
    }

    #evolutionBox {
        width: min(900px, 94%);
        padding: 25px;
        border-radius: 20px;
        background: #18232c;
        text-align: center;
        box-shadow: 0 20px 70px black;
    }

    #evolutionBox h1 {
        margin-top: 0;
        color: #ffd84d;
    }

    #choices {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
    }

    .choice {
        min-height: 190px;
        padding: 18px;
        border: 2px solid #3d5363;
        border-radius: 15px;
        background: #22323e;
        color: white;
        cursor: pointer;
        transition: transform .15s, border-color .15s, background .15s;
    }

    .choice:hover {
        transform: translateY(-5px);
        border-color: #ffd84d;
        background: #2c414f;
    }

    .choice .emoji {
        font-size: 55px;
    }

    .choice h2 {
        margin: 8px 0;
    }

    .choice p {
        color: #cbd5db;
        line-height: 1.4;
    }

    #gameOver {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0,0,0,.8);
        text-align: center;
    }

    #gameOverBox {
        padding: 35px;
        background: #18232c;
        border-radius: 20px;
    }

    #restart {
        padding: 13px 25px;
        border: 0;
        border-radius: 10px;
        background: #ffd84d;
        cursor: pointer;
        font-weight: bold;
        font-size: 16px;
    }

    @media (max-width: 650px) {
        #choices {
            grid-template-columns: 1fr;
            max-height: 75vh;
            overflow-y: auto;
        }

        .choice {
            min-height: 130px;
        }

        #controls {
            font-size: 11px;
        }
    }
</style>
</head>

<body>

<div id="game"></div>

<div id="ui">

    <div id="top">
        <div id="name">🦆 Baby Duck</div>

        <div>❤️ Health</div>
        <div class="bar">
            <div id="hpBar"></div>
        </div>

        <div>⭐ XP</div>
        <div class="bar">
            <div id="xpBar"></div>
        </div>

        <div id="stats">
            Level: <b id="level">1</b><br>
            Evolution: <b id="evolution">Baby Duck</b><br>
            Damage: <b id="damage">10</b><br>
            Speed: <b id="speed">0.15</b><br>
            Kills: <b id="kills">0</b>
        </div>
    </div>

    <div id="message"></div>

    <div id="crosshair">+</div>

    <div id="controls">
        <b>WASD</b> Move &nbsp; | &nbsp;
        <b>Mouse</b> Aim &nbsp; | &nbsp;
        <b>Click</b> Attack
    </div>
</div>

<div id="evolutionScreen">
    <div id="evolutionBox">
        <h1>🧬 EVOLUTION!</h1>
        <p>Choose your duck's next evolution.</p>

        <div id="choices"></div>
    </div>
</div>

<div id="gameOver">
    <div id="gameOverBox">
        <h1>💀 Your Duck Was Defeated!</h1>
        <p id="finalStats"></p>
        <button id="restart">Play Again</button>
    </div>
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

/* =========================================================
   GAME SETUP
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x78b8d8);
scene.fog = new THREE.Fog(0x78b8d8, 35, 90);

const camera = new THREE.PerspectiveCamera(
    65,
    innerWidth / innerHeight,
    0.1,
    200
);

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;

document.getElementById("game").appendChild(renderer.domElement);


/* =========================================================
   LIGHTING
========================================================= */

const ambient = new THREE.HemisphereLight(
    0xffffff,
    0x45604a,
    2
);

scene.add(ambient);

const sun = new THREE.DirectionalLight(
    0xffffff,
    3
);

sun.position.set(20, 30, 10);
sun.castShadow = true;

scene.add(sun);


/* =========================================================
   WORLD
========================================================= */

const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(150, 150),
    new THREE.MeshStandardMaterial({
        color: 0x4c9a52
    })
);

ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;

scene.add(ground);


/* Water */

const water = new THREE.Mesh(
    new THREE.CircleGeometry(17, 64),
    new THREE.MeshStandardMaterial({
        color: 0x3498db,
        transparent: true,
        opacity: .65
    })
);

water.rotation.x = -Math.PI / 2;
water.position.set(15, .02, -15);

scene.add(water);


/* Trees */

function makeTree(x, z) {

    const group = new THREE.Group();

    const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(.3, .4, 2.5, 8),
        new THREE.MeshStandardMaterial({
            color: 0x754c24
        })
    );

    trunk.position.y = 1.25;

    const leaves = new THREE.Mesh(
        new THREE.SphereGeometry(1.7, 10, 8),
        new THREE.MeshStandardMaterial({
            color: 0x287a3c
        })
    );

    leaves.position.y = 3;

    group.add(trunk);
    group.add(leaves);

    group.position.set(x, 0, z);

    scene.add(group);
}

for (let i = 0; i < 35; i++) {

    let x = (Math.random() - .5) * 100;
    let z = (Math.random() - .5) * 100;

    if (Math.abs(x) < 10 && Math.abs(z) < 10)
        continue;

    makeTree(x, z);
}


/* =========================================================
   DUCK
========================================================= */

const duck = new THREE.Group();

scene.add(duck);

function createDuck() {

    duck.clear();

    const color = evolution.color;

    const body = new THREE.Mesh(
        new THREE.SphereGeometry(1, 16, 12),
        new THREE.MeshStandardMaterial({
            color
        })
    );

    body.scale.set(1.2, .85, 1.35);
    body.position.y = 1;

    body.castShadow = true;

    duck.add(body);


    const head = new THREE.Mesh(
        new THREE.SphereGeometry(.72, 16, 12),
        new THREE.MeshStandardMaterial({
            color
        })
    );

    head.position.set(0, 1.8, -.65);

    head.castShadow = true;

    duck.add(head);


    const beak = new THREE.Mesh(
        new THREE.ConeGeometry(.32, .75, 12),
        new THREE.MeshStandardMaterial({
            color: 0xff9d19
        })
    );

    beak.rotation.x = Math.PI / 2;
    beak.position.set(0, 1.75, -1.35);

    duck.add(beak);


    const eyeMaterial = new THREE.MeshStandardMaterial({
        color: 0x111111
    });

    for (const side of [-1, 1]) {

        const eye = new THREE.Mesh(
            new THREE.SphereGeometry(.09, 8, 8),
            eyeMaterial
        );

        eye.position.set(
            side * .28,
            2.03,
            -1.2
        );

        duck.add(eye);
    }


    /* Evolution horns */

    if (evolution.horns) {

        for (const side of [-1, 1]) {

            const horn = new THREE.Mesh(
                new THREE.ConeGeometry(.16, .7, 8),
                new THREE.MeshStandardMaterial({
                    color: 0x6336ff
                })
            );

            horn.position.set(
                side * .35,
                2.5,
                -.65
            );

            duck.add(horn);
        }
    }


    /* Wings */

    for (const side of [-1, 1]) {

        const wing = new THREE.Mesh(
            new THREE.SphereGeometry(.55, 10, 8),
            new THREE.MeshStandardMaterial({
                color: color
            })
        );

        wing.scale.set(.4, .8, 1);
        wing.position.set(
            side * 1,
            1,
            0
        );

        duck.add(wing);
    }
}

duck.position.set(0, 0, 0);


/* =========================================================
   GAME DATA
========================================================= */

let evolution = {
    name: "Baby Duck",
    color: 0xffdf42,
    damage: 10,
    speed: .15,
    maxHp: 100,
    attackSpeed: 500,
    horns: false
};

let player = {
    hp: 100,
    xp: 0,
    level: 1,
    kills: 0
};

const evolutionOptions = [

    {
        name: "Fire Duck",
        emoji: "🔥🦆",
        description: "Launch powerful fireballs.",
        color: 0xff5a36,
        damage: 25,
        speed: .14,
        maxHp: 120,
        attackSpeed: 650,
        horns: false
    },

    {
        name: "Speed Duck",
        emoji: "⚡🦆",
        description: "Move incredibly fast and attack quickly.",
        color: 0x45c9ff,
        damage: 14,
        speed: .28,
        maxHp: 90,
        attackSpeed: 250,
        horns: false
    },

    {
        name: "Demon Duck",
        emoji: "😈🦆",
        description: "Huge damage and increased health.",
        color: 0x8f36ff,
        damage: 40,
        speed: .12,
        maxHp: 180,
        attackSpeed: 800,
        horns: true
    }

];


/* =========================================================
   ENEMIES
========================================================= */

const enemies = [];
const projectiles = [];

let bossAlive = false;

function spawnEnemy(isBoss = false) {

    const group = new THREE.Group();

    const enemyColor =
        isBoss ? 0x6419a8 : 0xd94343;

    const body = new THREE.Mesh(
        new THREE.SphereGeometry(
            isBoss ? 1.8 : .8,
            12,
            10
        ),
        new THREE.MeshStandardMaterial({
            color: enemyColor
        })
    );

    body.position.y = isBoss ? 1.8 : .8;

    group.add(body);


    const eye = new THREE.Mesh(
        new THREE.SphereGeometry(.1, 8, 8),
        new THREE.MeshStandardMaterial({
            color: 0xffff00
        })
    );

    eye.position.set(0, isBoss ? 2.2 : 1.1, -.7);

    group.add(eye);


    const angle = Math.random() * Math.PI * 2;
    const distance = 15 + Math.random() * 15;

    group.position.set(
        duck.position.x + Math.cos(angle) * distance,
        0,
        duck.position.z + Math.sin(angle) * distance
    );

    scene.add(group);

    const enemy = {

        mesh: group,

        hp: isBoss ? 500 : 35,

        maxHp: isBoss ? 500 : 35,

        damage: isBoss ? 20 : 8,

        speed: isBoss ? .035 : .055,

        boss: isBoss,

        attackCooldown: 0

    };

    enemies.push(enemy);

    if (isBoss)
        bossAlive = true;
}


/* Start enemies */

for (let i = 0; i < 12; i++)
    spawnEnemy();


/* =========================================================
   INPUT
========================================================= */

const keys = {};

window.addEventListener("keydown", e => {

    keys[e.key.toLowerCase()] = true;

});

window.addEventListener("keyup", e => {

    keys[e.key.toLowerCase()] = false;

});


renderer.domElement.addEventListener("click", attack);


/* =========================================================
   ATTACK
========================================================= */

let lastAttack = 0;

function attack() {

    const now = performance.now();

    if (now - lastAttack < evolution.attackSpeed)
        return;

    lastAttack = now;


    const direction = new THREE.Vector3();

    camera.getWorldDirection(direction);

    direction.y = 0;
    direction.normalize();


    const projectile = new THREE.Mesh(
        new THREE.SphereGeometry(.18, 8, 8),
        new THREE.MeshStandardMaterial({
            color:
                evolution.name === "Fire Duck"
                    ? 0xff3b20
                    : 0xffff55
        })
    );

    projectile.position.copy(
        duck.position
    );

    projectile.position.y = 1.3;

    scene.add(projectile);


    projectiles.push({

        mesh: projectile,

        direction,

        damage: evolution.damage,

        life: 100

    });
}


/* =========================================================
   XP / LEVELING
========================================================= */

function xpNeeded() {

    return player.level * 100;
}

function gainXP(amount) {

    player.xp += amount;

    if (player.xp >= xpNeeded()) {

        player.xp -= xpNeeded();

        player.level++;

        showMessage("⭐ LEVEL UP!");

        openEvolution();

    }

    updateUI();
}


/* =========================================================
   EVOLUTION MENU
========================================================= */

function openEvolution() {

    document.getElementById("evolutionScreen").style.display =
        "flex";

    const choices =
        document.getElementById("choices");

    choices.innerHTML = "";

    evolutionOptions.forEach(option => {

        const button = document.createElement("button");

        button.className = "choice";

        button.innerHTML = `
            <div class="emoji">${option.emoji}</div>
            <h2>${option.name}</h2>
            <p>${option.description}</p>
            <small>
                Damage: ${option.damage}<br>
                Speed: ${option.speed}<br>
                Health: ${option.maxHp}
            </small>
        `;

        button.addEventListener("click", () => {

            evolution = {
                ...option
            };

            player.hp = evolution.maxHp;

            createDuck();

            document.getElementById("evolutionScreen")
                .style.display = "none";

            showMessage(
                "🧬 Evolved into " + evolution.name
            );

            updateUI();
        });

        choices.appendChild(button);

    });
}


/* =========================================================
   DAMAGE / DEATH
========================================================= */

function damagePlayer(amount) {

    player.hp -= amount;

    if (player.hp <= 0) {

        player.hp = 0;

        document.getElementById("finalStats").textContent =
            `Level ${player.level} • ${player.kills} kills`;

        document.getElementById("gameOver")
            .style.display = "flex";
    }

    updateUI();
}


/* =========================================================
   ENEMY DEATH
========================================================= */

function killEnemy(enemy) {

    scene.remove(enemy.mesh);

    const index = enemies.indexOf(enemy);

    if (index !== -1)
        enemies.splice(index, 1);

    player.kills++;

    gainXP(
        enemy.boss ? 250 : 25
    );

    showMessage(
        enemy.boss
            ? "👑 BOSS DEFEATED! +250 XP"
            : "💥 Enemy defeated! +25 XP"
    );


    if (enemy.boss)
        bossAlive = false;


    setTimeout(() => {

        if (!bossAlive && Math.random() < .15)
            spawnEnemy(true);
        else
            spawnEnemy();

    }, 1000);
}


/* =========================================================
   UPDATE ENEMIES
========================================================= */

function updateEnemies() {

    for (const enemy of [...enemies]) {

        const direction = new THREE.Vector3()
            .subVectors(
                duck.position,
                enemy.mesh.position
            );

        const distance = direction.length();

        direction.normalize();


        if (distance > 2.5) {

            enemy.mesh.position.addScaledVector(
                direction,
                enemy.speed
            );

        } else {

            enemy.attackCooldown -= 16;

            if (enemy.attackCooldown <= 0) {

                damagePlayer(enemy.damage);

                enemy.attackCooldown = 1000;
            }
        }

        enemy.mesh.lookAt(
            duck.position.x,
            enemy.mesh.position.y,
            duck.position.z
        );
    }
}


/* =========================================================
   UPDATE PROJECTILES
========================================================= */

function updateProjectiles() {

    for (const projectile of [...projectiles]) {

        projectile.mesh.position.addScaledVector(
            projectile.direction,
            .65
        );

        projectile.life--;

        let hit = false;

        for (const enemy of [...enemies]) {

            const distance =
                projectile.mesh.position.distanceTo(
                    enemy.mesh.position
                );

            if (distance < (enemy.boss ? 2 : 1.4)) {

                enemy.hp -= projectile.damage;

                hit = true;

                if (enemy.hp <= 0)
                    killEnemy(enemy);

                break;
            }
        }

        if (hit || projectile.life <= 0) {

            scene.remove(projectile.mesh);

            const index =
                projectiles.indexOf(projectile);

            if (index !== -1)
                projectiles.splice(index, 1);
        }
    }
}


/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function updatePlayer() {

    let dx = 0;
    let dz = 0;

    if (keys["w"])
        dz -= 1;

    if (keys["s"])
        dz += 1;

    if (keys["a"])
        dx -= 1;

    if (keys["d"])
        dx += 1;


    if (dx !== 0 || dz !== 0) {

        const length =
            Math.sqrt(dx * dx + dz * dz);

        dx /= length;
        dz /= length;


        duck.position.x +=
            dx * evolution.speed;

        duck.position.z +=
            dz * evolution.speed;
    }


    /* Camera follows duck */

    camera.position.lerp(
        new THREE.Vector3(
            duck.position.x,
            duck.position.y + 12,
            duck.position.z + 14
        ),
        .08
    );

    camera.lookAt(
        duck.position.x,
        duck.position.y,
        duck.position.z
    );
}


/* =========================================================
   UI
========================================================= */

function updateUI() {

    document.getElementById("name").textContent =
        "🦆 " + evolution.name;

    document.getElementById("level").textContent =
        player.level;

    document.getElementById("evolution").textContent =
        evolution.name;

    document.getElementById("damage").textContent =
        evolution.damage;

    document.getElementById("speed").textContent =
        evolution.speed.toFixed(2);

    document.getElementById("kills").textContent =
        player.kills;

    document.getElementById("hpBar").style.width =
        Math.max(
            0,
            player.hp / evolution.maxHp * 100
        ) + "%";

    document.getElementById("xpBar").style.width =
        Math.min(
            100,
            player.xp / xpNeeded() * 100
        ) + "%";
}


/* =========================================================
   MESSAGES
========================================================= */

let messageTimer;

function showMessage(text) {

    const message =
        document.getElementById("message");

    message.textContent = text;
    message.style.opacity = "1";

    clearTimeout(messageTimer);

    messageTimer = setTimeout(() => {

        message.style.opacity = "0";

    }, 1500);
}


/* =========================================================
   RESTART
========================================================= */

document.getElementById("restart")
    .addEventListener("click", () => {

        location.reload();

    });


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener("resize", () => {

    camera.aspect =
        innerWidth / innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        innerWidth,
        innerHeight
    );

});


/* =========================================================
   GAME LOOP
========================================================= */

createDuck();

camera.position.set(
    0,
    12,
    14
);

camera.lookAt(0, 0, 0);

updateUI();

let lastTime = performance.now();

function gameLoop(time) {

    requestAnimationFrame(gameLoop);

    updatePlayer();
    updateEnemies();
    updateProjectiles();

    renderer.render(
        scene,
        camera
    );
}

requestAnimationFrame(gameLoop);

</script>

</body>
</html>
