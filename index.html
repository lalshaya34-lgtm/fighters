<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duck Fighter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game">
    <header>
      <h1>🦆 DUCK FIGHTER</h1>
      <div class="stats">
        <span>❤️ <b id="health">100</b></span>
        <span>⭐ Lv <b id="level">1</b></span>
        <span>🪙 <b id="coins">0</b></span>
      </div>
    </header>

    <main>
      <canvas id="canvas" width="900" height="500"></canvas>

      <div id="controls">
        <button data-key="ArrowLeft">⬅️</button>
        <button data-key="ArrowRight">➡️</button>
        <button data-key="Space">🥊 ATTACK</button>
        <button data-key="ArrowUp">⬆️</button>
      </div>

      <section id="upgradePanel">
        <h2>🛒 Duck Upgrades</h2>
        <div id="upgrades"></div>
      </section>

      <div id="message"></div>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="input.js"></script>
  <script src="player.js"></script>
  <script src="enemies.js"></script>
  <script src="combat.js"></script>
  <script src="upgrades.js"></script>
  <script src="ui.js"></script>
  <script src="game.js"></script>
</body>
</html>
