<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Frog Evolution — Fixed</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#83d9ff;
}

canvas{display:block}

#ui{
  position:fixed;
  top:12px;
  left:12px;
  z-index:10;
  color:#fff;
  text-shadow:2px 2px 4px #000;
  pointer-events:none;
  min-width:270px;
}

#title{
  font-size:25px;
  font-weight:900;
}

.panel{
  margin-top:7px;
  padding:9px 11px;
  border-radius:12px;
  background:rgba(0,0,0,.42);
  backdrop-filter:blur(4px);
}

.bar{
  height:14px;
  background:#222;
  border:2px solid #fff;
  border-radius:8px;
  overflow:hidden;
  margin:4px 0 7px;
}

.fill{
  height:100%;
  width:0%;
  transition:width .15s;
}

#hpFill{background:#ff4141}
#xpFill{background:#ffe229}
#stamFill{background:#45d9ff}
#hungerFill{background:#ff9d35}

#right{
  position:fixed;
  right:12px;
  top:12px;
  z-index:10;
  width:235px;
  color:#fff;
  text-shadow:1px 1px 3px #000;
}

#quest{
  background:rgba(0,0,0,.42);
  padding:10px;
  border-radius:12px;
}

#buttons{
  pointer-events:auto;
  margin-top:7px;
}

button{
  border:0;
  border-radius:9px;
  padding:9px 11px;
  margin:3px;
  cursor:pointer;
  font-weight:bold;
  background:#fff;
  color:#163b1d;
  touch-action:none;
}

button:hover{
  filter:brightness(1.08);
}

button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

#bottom{
  position:fixed;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
  z-index:10;
  color:#fff;
  text-shadow:2px 2px 4px #000;
  text-align:center;
  background:rgba(0,0,0,.35);
  padding:7px 12px;
  border-radius:10px;
  pointer-events:none;
}

#message{
  position:fixed;
  top:48%;
  left:50%;
  transform:translate(-50%,-50%);
  z-index:30;
  color:white;
  text-align:center;
  font-size:40px;
  font-weight:900;
  text-shadow:3px 3px 7px #000;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s;
}

#mobile{
  position:fixed;
  bottom:15px;
  right:15px;
  z-index:20;
  display:none;
  pointer-events:auto;
}

.pad{
  display:grid;
  grid-template-columns:55px 55px 55px;
  gap:5px;
}

.pad button{
  height:50px;
  background:rgba(255,255,255,.75);
}

#attackBtn{
  height:55px;
  background:#ffdb45;
}

@media(max-width:700px){
  #right{
    width:180px;
    font-size:12px;
  }

  #title{
    font-size:19px;
  }

  #bottom{
    font-size:10px;
    bottom:5px;
  }

  #mobile{
    display:block;
  }
}
</style>
</head>

<body>

<div id="ui">
  <div id="title">🐸 FROG EVOLUTION</div>

  <div class="panel">
    <b id="evoName">Tiny Frog</b>

    <div>
      Level <span id="level">1</span>
      · Size <span id="size">1.0</span>x
    </div>

    <div>❤️ HP</div>
    <div class="bar">
      <div id="hpFill" class="fill"></div>
    </div>

    <div>⭐ XP <span id="xpText">0/35</span></div>
    <div class="bar">
      <div id="xpFill" class="fill"></div>
    </div>

    <div>⚡ Stamina</div>
    <div class="bar">
      <div id="stamFill" class="fill"></div>
    </div>

    <div>🍖 Hunger</div>
    <div class="bar">
      <div id="hungerFill" class="fill"></div>
    </div>

    <div>🪙 Coins: <span id="coins">0</span></div>
    <div>🧬 Mutation: <span id="mutation">None</span></div>
  </div>
</div>

<div id="right">

  <div id="quest">
    <b>📜 QUEST</b>

    <div id="questText">
      Defeat 3 creatures
    </div>

    <div>
      Progress:
      <span id="questProgress">0/3</span>
    </div>

    <hr>

    <div>
      🏆 Achievements:
      <span id="achievements">0</span>
    </div>

    <div>
      📖 Discoveries:
      <span id="discoveries">0</span>
    </div>

    <div>
      🔥 Rebirths:
      <span id="rebirths">0</span>
    </div>
  </div>

  <div id="buttons">
    <button id="healBtn">💚 Heal 10 🪙</button>
    <button id="mutateBtn">🧬 Mutation 40 🪙</button>
    <button id="rebirthBtn">♻️ Rebirth</button>
  </div>

</div>

<div id="bottom">
  WASD / Arrows Move · SPACE Attack · SHIFT Sprint · E Ability · Mouse Drag Camera
</div>

<div id="message"></div>

<div id="mobile">

  <div class="pad">
    <span></span>
    <button data-key="w">▲</button>
    <span></span>

    <button data-key="a">◀</button>
    <button data-key="s">▼</button>
    <button data-key="d">▶</button>
  </div>

  <button id="attackBtn">🐸 ATTACK</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>

<script>
"use strict";

/* =========================================================
   SAFETY
========================================================= */

const $ = id => document.getElementById(id);

if(typeof THREE === "undefined"){
  document.body.innerHTML =
    "<h1 style='color:white;padding:30px'>Three.js failed to load. Check your internet connection and reload.</h1>";
  throw new Error("Three.js unavailable");
}

/* =========================================================
   THREE.JS
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x86d9ff);

scene.fog = new THREE.Fog(
  0x86d9ff,
  35,
  125
);

const camera = new THREE.PerspectiveCamera(
  65,
  innerWidth / innerHeight,
  .1,
  300
);

const renderer = new THREE.WebGLRenderer({
  antialias:true
});

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.setPixelRatio(
  Math.min(devicePixelRatio,2)
);

renderer.shadowMap.enabled = true;

document.body.appendChild(
  renderer.domElement
);

/* =========================================================
   LIGHT
========================================================= */

const hemi =
  new THREE.HemisphereLight(
    0xffffff,
    0x355f35,
    2
  );

scene.add(hemi);

const sun =
  new THREE.DirectionalLight(
    0xffffff,
    2
  );

sun.position.set(
  30,
  60,
  20
);

sun.castShadow = true;

scene.add(sun);

/* =========================================================
   STATE
========================================================= */

const state = {
  level:1,
  xp:0,

  coins:0,

  hp:100,
  maxHp:100,

  stamina:100,
  hunger:100,

  size:1,
  speed:.16,
  damage:12,

  rebirths:0,

  mutation:"None",

  kills:0,

  discoveries:new Set(),
  achievements:new Set(),

  questKills:0,
  questGoal:3,

  attackCooldown:0,
  abilityCooldown:0,
  invulnerable:0,

  score:0
};

const evolutionNames = [
  "Tiny Frog",
  "Young Frog",
  "Mega Frog",
  "Jungle Frog",
  "Armored Frog",
  "Titan Frog",
  "Ancient Frog",
  "Mythic Frog",
  "Frog King",
  "COSMIC FROG"
];

const mutationNames = [
  "None",
  "Fire",
  "Ice",
  "Poison",
  "Electric",
  "Giant",
  "Stealth"
];

const keys = {};

let cameraAngle = 0;
let mouseDown = false;
let lastMouseX = 0;

let messageTimer = null;

let worldTime = 0;
let eventTimer = 25;

const clock = new THREE.Clock();

/* =========================================================
   WORLD
========================================================= */

const ground =
  new THREE.Mesh(
    new THREE.CylinderGeometry(
      78,
      78,
      1,
      64
    ),
    new THREE.MeshStandardMaterial({
      color:0x4eaa42
    })
  );

ground.position.y=-.5;
ground.receiveShadow=true;

scene.add(ground);

function createPond(x,z,r){

  const pond =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        r,r,.18,40
      ),
      new THREE.MeshStandardMaterial({
        color:0x269fe0,
        transparent:true,
        opacity:.85
      })
    );

  pond.position.set(x,.02,z);

  scene.add(pond);
}

createPond(-25,-18,15);
createPond(28,25,11);

/* =========================================================
   TREES
========================================================= */

function createTree(x,z){

  const group =
    new THREE.Group();

  const trunk =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .55,.8,5,8
      ),
      new THREE.MeshStandardMaterial({
        color:0x75451f
      })
    );

  trunk.position.y=2.5;
  trunk.castShadow=true;

  group.add(trunk);

  const leaves =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        3,12,10
      ),
      new THREE.MeshStandardMaterial({
        color:0x168737
      })
    );

  leaves.position.y=6;
  leaves.castShadow=true;

  group.add(leaves);

  group.position.set(
    x,0,z
  );

  scene.add(group);
}

for(let i=0;i<55;i++){

  const x=(Math.random()-.5)*135;
  const z=(Math.random()-.5)*135;

  if(Math.hypot(x,z)<12) continue;

  createTree(x,z);
}

/* =========================================================
   ROCKS
========================================================= */

for(let i=0;i<45;i++){

  const rock =
    new THREE.Mesh(
      new THREE.DodecahedronGeometry(
        .4+Math.random()*.8,
        0
      ),
      new THREE.MeshStandardMaterial({
        color:0x777777
      })
    );

  rock.position.set(
    (Math.random()-.5)*135,
    .35,
    (Math.random()-.5)*135
  );

  rock.scale.y=.5;
  rock.castShadow=true;

  scene.add(rock);
}

/* =========================================================
   FROG
========================================================= */

const frog =
  new THREE.Group();

scene.add(frog);

const frogBody =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      1.1,20,16
    ),
    new THREE.MeshStandardMaterial({
      color:0x35c94a
    })
  );

frogBody.scale.set(
  1.15,.75,1.25
);

frogBody.position.y=1.05;
frogBody.castShadow=true;

frog.add(frogBody);

function addFrogEye(x){

  const white =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .32,12,12
      ),
      new THREE.MeshStandardMaterial({
        color:0xffffff
      })
    );

  white.position.set(
    x,1.65,.6
  );

  const pupil =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .13,10,10
      ),
      new THREE.MeshStandardMaterial({
        color:0x111111
      })
    );

  pupil.position.set(
    x,1.67,.88
  );

  frog.add(
    white,
    pupil
  );
}

addFrogEye(-.48);
addFrogEye(.48);

const mouth =
  new THREE.Mesh(
    new THREE.TorusGeometry(
      .35,.06,8,20,Math.PI
    ),
    new THREE.MeshStandardMaterial({
      color:0x441111
    })
  );

mouth.rotation.x=Math.PI;
mouth.position.set(
  0,.92,1.02
);

frog.add(mouth);

/* =========================================================
   ANIMALS
========================================================= */

const animalTypes = [
  {
    name:"Bug",
    color:0xffcf26,
    size:.45,
    xp:4,
    coins:2,
    speed:.035,
    hp:15
  },
  {
    name:"Fish",
    color:0xff7144,
    size:.6,
    xp:7,
    coins:4,
    speed:.04,
    hp:25
  },
  {
    name:"Mouse",
    color:0xaaaaaa,
    size:.7,
    xp:9,
    coins:5,
    speed:.055,
    hp:30
  },
  {
    name:"Lizard",
    color:0x55b95a,
    size:.8,
    xp:12,
    coins:7,
    speed:.045,
    hp:40
  },
  {
    name:"Snake",
    color:0x914dcc,
    size:1,
    xp:18,
    coins:10,
    speed:.045,
    hp:55
  },
  {
    name:"Crab",
    color:0xff5544,
    size:1.2,
    xp:25,
    coins:14,
    speed:.04,
    hp:75
  },
  {
    name:"Turtle",
    color:0x357d52,
    size:1.5,
    xp:35,
    coins:18,
    speed:.025,
    hp:100
  },
  {
    name:"Bird",
    color:0x55aaff,
    size:1.4,
    xp:45,
    coins:25,
    speed:.07,
    hp:120
  }
];

const animals=[];

function randomSpawnPosition(){

  let x;
  let z;

  do{
    x=(Math.random()-.5)*130;
    z=(Math.random()-.5)*130;
  }
  while(
    Math.hypot(x-frog.position.x,z-frog.position.z)<14
  );

  return new THREE.Vector3(
    x,
    0,
    z
  );
}

function createAnimal(
  typeIndex=null,
  boss=false,
  forcedPosition=null
){

  const safeIndex =
    typeIndex===null
      ? Math.floor(
          Math.random()*animalTypes.length
        )
      : Math.max(
          0,
          Math.min(
            animalTypes.length-1,
            Math.floor(typeIndex)
          )
        );

  const type=animalTypes[safeIndex];

  const group =
    new THREE.Group();

  const multiplier=boss ? 1.8 : 1;

  const body =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        type.size*multiplier,
        12,
        10
      ),
      new THREE.MeshStandardMaterial({
        color:type.color
      })
    );

  body.scale.set(
    1.3,.8,1
  );

  body.position.y=
    type.size*multiplier;

  body.castShadow=true;

  group.add(body);

  for(const x of [-.22,.22]){

    const eye =
      new THREE.Mesh(
        new THREE.SphereGeometry(
          .12,8,8
        ),
        new THREE.MeshStandardMaterial({
          color:0x111111
        })
      );

    eye.position.set(
      x*type.size*2,
      type.size*1.3*multiplier,
      type.size*.8*multiplier
    );

    group.add(eye);
  }

  const maxHp =
    type.hp*(boss ? 5 : 1);

  group.userData={
    type,
    hp:maxHp,
    maxHp,
    boss,
    wander:Math.random()*100
  };

  const spawn =
    forcedPosition instanceof THREE.Vector3
      ? forcedPosition.clone()
      : randomSpawnPosition();

  group.position.copy(spawn);

  scene.add(group);
  animals.push(group);

  return group;
}

for(let i=0;i<50;i++){
  createAnimal();
}

/* =========================================================
   PARTICLES
========================================================= */

const particles=[];

function burst(
  position,
  color=0xffffff,
  count=12
){

  const safeCount=
    Math.max(
      0,
      Math.min(
        60,
        Math.floor(count)
      )
    );

  for(let i=0;i<safeCount;i++){

    const particle =
      new THREE.Mesh(
        new THREE.SphereGeometry(
          .07,5,5
        ),
        new THREE.MeshBasicMaterial({
          color
        })
      );

    particle.position.copy(position);

    particle.userData={
      life:.7,
      vx:(Math.random()-.5)*.15,
      vy:Math.random()*.15+.04,
      vz:(Math.random()-.5)*.15
    };

    scene.add(particle);
    particles.push(particle);
  }
}

function updateParticles(dt){

  for(
    let i=particles.length-1;
    i>=0;
    i--
  ){

    const p=particles[i];

    p.userData.life-=dt;

    p.position.x+=
      p.userData.vx;

    p.position.y+=
      p.userData.vy;

    p.position.z+=
      p.userData.vz;

    p.userData.vy-=.003;

    if(p.userData.life<=0){

      scene.remove(p);
      particles.splice(i,1);
    }
  }
}

/* =========================================================
   UI
========================================================= */

function xpNeeded(){

  return Math.max(
    1,
    Math.floor(
      20+
      state.level*15+
      state.rebirths*10
    )
  );
}

function updateUI(){

  const need=xpNeeded();

  $("evoName").textContent=
    evolutionNames[
      Math.min(
        state.level-1,
        evolutionNames.length-1
      )
    ];

  $("level").textContent=
    state.level;

  $("size").textContent=
    state.size.toFixed(1);

  $("coins").textContent=
    Math.floor(state.coins);

  $("mutation").textContent=
    state.mutation;

  $("hpFill").style.width=
    `${Math.max(
      0,
      Math.min(
        100,
        state.hp/state.maxHp*100
      )
    )}%`;

  $("xpFill").style.width=
    `${Math.max(
      0,
      Math.min(
        100,
        state.xp/need*100
      )
    )}%`;

  $("stamFill").style.width=
    `${Math.max(
      0,
      Math.min(100,state.stamina)
    )}%`;

  $("hungerFill").style.width=
    `${Math.max(
      0,
      Math.min(100,state.hunger)
    )}%`;

  $("xpText").textContent=
    `${Math.floor(state.xp)}/${need}`;

  $("questProgress").textContent=
    `${state.questKills}/${state.questGoal}`;

  $("achievements").textContent=
    state.achievements.size;

  $("discoveries").textContent=
    state.discoveries.size;

  $("rebirths").textContent=
    state.rebirths;
}

function message(
  text,
  color="#fff"
){

  const element=$("message");

  element.textContent=text;
  element.style.color=color;
  element.style.opacity="1";

  if(messageTimer!==null){
    clearTimeout(messageTimer);
  }

  messageTimer=setTimeout(()=>{
    element.style.opacity="0";
    messageTimer=null;
  },1100);
}

/* =========================================================
   ACHIEVEMENTS
========================================================= */

function unlockAchievement(name){

  if(
    typeof name!=="string" ||
    name.length===0
  ){
    return false;
  }

  if(state.achievements.has(name)){
    return false;
  }

  state.achievements.add(name);

  state.coins+=15;

  message(
    "🏆 "+name+" +15 🪙",
    "#ffe229"
  );

  return true;
}

/* =========================================================
   EVOLUTION
========================================================= */

function gainXP(amount){

  const safeAmount=
    Number.isFinite(amount)
      ? Math.max(0,amount)
      : 0;

  state.xp+=safeAmount;

  state.score+=safeAmount;

  let evolutionCount=0;

  while(
    state.xp>=xpNeeded() &&
    evolutionCount<100
  ){

    state.xp-=xpNeeded();

    evolve();

    evolutionCount++;
  }

  updateUI();
}

function evolve(){

  state.level++;

  state.size+=.28;
  state.speed+=.012;
  state.damage+=5;

  state.maxHp+=20;
  state.hp=state.maxHp;

  frog.scale.set(
    state.size,
    state.size,
    state.size
  );

  const colors=[
    0x35c94a,
    0x22aa55,
    0x168b66,
    0x6d4bcc,
    0xff8c32,
    0xd93472,
    0x3cccf2,
    0xffdf4d,
    0xf5f5f5,
    0x9dff00
  ];

  frogBody.material.color.setHex(
    colors[
      Math.min(
        state.level-1,
        colors.length-1
      )
    ]
  );

  burst(
    frog.position,
    colors[
      Math.min(
        state.level-1,
        colors.length-1
      )
    ],
    30
  );

  if(state.level===3){
    unlockAchievement("Mega Frog");
  }

  if(state.level===5){
    unlockAchievement("Titan");
  }

  if(state.level===10){
    unlockAchievement("Cosmic Frog");
  }

  message(
    "EVOLVED! 🧬 "+
    evolutionNames[
      Math.min(
        state.level-1,
        evolutionNames.length-1
      )
    ],
    "#ffe229"
  );

  updateUI();
}

/* =========================================================
   COMBAT
========================================================= */

function attack(){

  if(state.attackCooldown>0){
    return;
  }

  state.attackCooldown=.38;

  frog.scale.set(
    state.size*1.18,
    state.size*.82,
    state.size*1.18
  );

  setTimeout(()=>{

    frog.scale.set(
      state.size,
      state.size,
      state.size
    );

  },100);

  const range=
    3.2*state.size;

  let target=null;
  let closest=Infinity;

  for(const animal of animals){

    if(
      !animal ||
      !animal.parent
    ){
      continue;
    }

    const distance=
      frog.position.distanceTo(
        animal.position
      );

    if(
      distance<range &&
      distance<closest
    ){

      closest=distance;
      target=animal;
    }
  }

  if(!target){
    return;
  }

  let damage=state.damage;

  if(state.mutation==="Fire"){
    damage*=1.35;
  }

  if(state.mutation==="Electric"){
    damage*=1.5;
  }

  if(state.mutation==="Giant"){
    damage*=1.25;
  }

  target.userData.hp-=damage;

  burst(
    target.position,
    state.mutation==="Fire"
      ? 0xff5522
      : 0xffff66,
    8
  );

  if(
    target.userData.hp<=0
  ){

    defeatAnimal(target);

  }else{

    // Knockback
    const dx=
      target.position.x-frog.position.x;

    const dz=
      target.position.z-frog.position.z;

    const length=
      Math.max(.001,Math.hypot(dx,dz));

    target.position.x+=
      dx/length*.8;

    target.position.z+=
      dz/length*.8;
  }
}

function defeatAnimal(animal){

  if(
    !animal ||
    !animal.userData ||
    !animal.parent
  ){
    return;
  }

  const type=
    animal.userData.type;

  const bonus=
    animal.userData.boss
      ? 5
      : 1;

  state.kills++;
  state.coins+=type.coins*bonus;

  state.questKills++;

  state.discoveries.add(
    type.name
  );

  gainXP(
    type.xp*bonus
  );

  burst(
    animal.position,
    type.color,
    animal.userData.boss ? 30 : 14
  );

  if(state.kills===1){
    unlockAchievement("First Hunt");
  }

  if(state.kills>=10){
    unlockAchievement("Hunter");
  }

  if(state.kills>=50){
    unlockAchievement("Apex");
  }

  if(state.discoveries.size>=8){
    unlockAchievement("Explorer");
  }

  const index=
    animals.indexOf(animal);

  if(index>=0){
    animals.splice(index,1);
  }

  scene.remove(animal);

  if(
    state.questKills>=
    state.questGoal
  ){

    state.coins+=25;

    state.questKills=0;

    state.questGoal=
      Math.min(
        30,
        state.questGoal+3
      );

    message(
      "QUEST COMPLETE! +25 🪙",
      "#ffe229"
    );
  }

  setTimeout(()=>{

    createAnimal();

  },700);

  updateUI();
}

/* =========================================================
   SPECIAL ABILITY
========================================================= */

function ability(){

  if(state.abilityCooldown>0){
    return;
  }

  state.abilityCooldown=8;

  let radius=
    5*state.size;

  if(state.mutation==="Giant"){
    radius*=1.4;
  }

  if(state.mutation==="Electric"){
    radius*=1.2;
  }

  let hit=0;

  // Copy the array so removals during combat
  // cannot corrupt the loop.
  const targets=
    animals.slice();

  for(const animal of targets){

    if(
      !animal ||
      !animal.parent
    ){
      continue;
    }

    if(
      frog.position.distanceTo(
        animal.position
      )<radius
    ){

      animal.userData.hp-=
        state.damage*2;

      hit++;

      if(
        animal.userData.hp<=0
      ){
        defeatAnimal(animal);
      }
    }
  }

  const particleColor=
    state.mutation==="Ice"
      ? 0x75ddff
      : state.mutation==="Poison"
      ? 0x9dff4a
      : state.mutation==="Electric"
      ? 0xffff44
      : 0xffffff;

  burst(
    frog.position,
    particleColor,
    35
  );

  if(hit>0){
    message(
      "SPECIAL ATTACK! 💥",
      "#ffffff"
    );
  }

  updateUI();
}

/* =========================================================
   MOVEMENT
========================================================= */

function moveFrog(dt){

  let x=0;
  let z=0;

  if(keys.w || keys.arrowup){
    z-=1;
  }

  if(keys.s || keys.arrowdown){
    z+=1;
  }

  if(keys.a || keys.arrowleft){
    x-=1;
  }

  if(keys.d || keys.arrowright){
    x+=1;
  }

  const length=
    Math.hypot(x,z);

  if(length>0){

    x/=length;
    z/=length;

    let currentSpeed=
      state.speed;

    if(
      keys.shift &&
      state.stamina>0
    ){

      currentSpeed*=1.8;

      state.stamina-=
        35*dt;

    }else{

      state.stamina+=
        25*dt;
    }

    state.stamina=
      Math.max(
        0,
        Math.min(
          100,
          state.stamina
        )
      );

    frog.position.x+=
      x*currentSpeed;

    frog.position.z+=
      z*currentSpeed;

    frog.rotation.y=
      Math.atan2(x,z);

    frog.position.y=
      Math.abs(
        Math.sin(
          performance.now()*.015
        )
      )*.15;

  }else{

    state.stamina=
      Math.min(
        100,
        state.stamina+18*dt
      );

    frog.position.y=0;
  }

  frog.position.x=
    THREE.MathUtils.clamp(
      frog.position.x,
      -70,
      70
    );

  frog.position.z=
    THREE.MathUtils.clamp(
      frog.position.z,
      -70,
      70
    );
}

/* =========================================================
   ENEMY AI
========================================================= */

function updateAnimals(dt){

  for(const animal of animals){

    if(
      !animal ||
      !animal.parent ||
      !animal.userData
    ){
      continue;
    }

    const type=
      animal.userData.type;

    const dx=
      frog.position.x-
      animal.position.x;

    const dz=
      frog.position.z-
      animal.position.z;

    const distance=
      Math.hypot(dx,dz);

    if(
      state.size>
        type.size*1.6 &&
      distance<9
    ){

      const length=
        Math.max(.001,distance);

      animal.position.x-=
        dx/length*
        type.speed*
        dt*60;

      animal.position.z-=
        dz/length*
        type.speed*
        dt*60;

    }else if(
      (
        type.size>
          state.size*.9 ||
        animal.userData.boss
      ) &&
      distance<3.2
    ){

      if(
        state.invulnerable<=0
      ){

        const damage=
          5+type.size*4;

        state.hp-=damage;

        state.invulnerable=.7;

        message(
          "OUCH! -"+
          Math.floor(damage),
          "#ff5555"
        );

        if(state.hp<=0){
          respawn();
        }
      }

    }else{

      animal.userData.wander+=dt;

      animal.position.x+=
        Math.sin(
          animal.userData.wander+
          animal.id
        )*
        type.speed*.12;

      animal.position.z+=
        Math.cos(
          animal.userData.wander*.8+
          animal.id
        )*
        type.speed*.12;
    }

    animal.position.x=
      THREE.MathUtils.clamp(
        animal.position.x,
        -72,
        72
      );

    animal.position.z=
      THREE.MathUtils.clamp(
        animal.position.z,
        -72,
        72
      );
  }
}

/* =========================================================
   HUNGER
========================================================= */

function updateHunger(dt){

  state.hunger=
    Math.max(
      0,
      state.hunger-dt*.7
    );

  if(state.hunger<=0){

    state.hp-=
      dt*2;

    if(state.hp<=0){
      respawn();
    }
  }
}

/* =========================================================
   RESPAWN
========================================================= */

function respawn(){

  state.hp=
    Math.max(
      1,
      state.maxHp*.7
    );

  state.hunger=100;
  state.stamina=100;

  state.coins=
    Math.max(
      0,
      state.coins-10
    );

  frog.position.set(
    0,0,0
  );

  state.invulnerable=2;

  message(
    "You respawned! -10 🪙",
    "#ff7777"
  );

  updateUI();
}

/* =========================================================
   MUTATIONS
========================================================= */

function buyMutation(){

  if(state.coins<40){

    message(
      "Need 40 coins!",
      "#ff7777"
    );

    return;
  }

  state.coins-=40;

  const choices=
    mutationNames.slice(1);

  state.mutation=
    choices[
      Math.floor(
        Math.random()*
        choices.length
      )
    ];

  // Achievement reward is deliberately separate
  // from the mutation purchase.
  const firstMutation=
    !state.achievements.has(
      "Mutated"
    );

  if(firstMutation){
    unlockAchievement("Mutated");
  }

  if(state.mutation==="Giant"){

    state.size+=.5;
    state.maxHp+=35;
    state.hp=state.maxHp;
  }

  if(state.mutation==="Fire"){
    state.damage*=1.2;
  }

  if(state.mutation==="Poison"){
    state.damage*=1.1;
  }

  if(state.mutation==="Stealth"){
    state.speed*=1.2;
  }

  frog.scale.set(
    state.size,
    state.size,
    state.size
  );

  message(
    "MUTATION: "+
    state.mutation,
    "#9dff00"
  );

  updateUI();
}

/* =========================================================
   HEAL
========================================================= */

function heal(){

  if(state.coins<10){

    message(
      "Need 10 coins!",
      "#ff7777"
    );

    return;
  }

  if(state.hp>=state.maxHp){

    message(
      "Already full HP",
      "#ffffff"
    );

    return;
  }

  state.coins-=10;

  state.hp=
    Math.min(
      state.maxHp,
      state.hp+35
    );

  updateUI();
}

/* =========================================================
   REBIRTH
========================================================= */

function rebirth(){

  if(state.level<10){

    message(
      "Reach level 10 first!",
      "#ff7777"
    );

    return;
  }

  state.rebirths++;

  state.level=1;
  state.xp=0;

  state.size=1;

  state.speed=
    .16+
    .02*state.rebirths;

  state.damage=
    12+
    state.rebirths*8;

  state.maxHp=
    100+
    state.rebirths*25;

  state.hp=
    state.maxHp;

  state.stamina=100;
  state.hunger=100;

  state.mutation="None";

  frog.scale.set(
    1,1,1
  );

  // Only the first rebirth grants the achievement reward.
  unlockAchievement("Rebirth");

  message(
    "♻️ REBIRTH! Permanent power gained!",
    "#9dff00"
  );

  updateUI();
}

/* =========================================================
   RANDOM EVENTS
========================================================= */

function randomEvents(dt){

  eventTimer-=dt;

  if(eventTimer>0){
    return;
  }

  eventTimer=
    25+
    Math.random()*25;

  const roll=
    Math.random();

  if(roll<.35){

    for(let i=0;i<5;i++){
      createAnimal(7);
    }

    message(
      "🐦 BIRD SWARM!",
      "#55aaff"
    );

  }else if(roll<.65){

    state.coins+=20;

    message(
      "💰 TREASURE EVENT! +20",
      "#ffe229"
    );

  }else if(roll<.85){

    state.stamina=100;

    state.hp=
      Math.min(
        state.maxHp,
        state.hp+20
      );

    state.hunger=100;

    message(
      "🌧️ RAIN HEALS YOU!",
      "#55ddff"
    );

  }else{

    const bossPosition=
      frog.position.clone();

    const direction=
      new THREE.Vector3(
        Math.sin(cameraAngle),
        0,
        Math.cos(cameraAngle)
      );

    bossPosition.addScaledVector(
      direction,
      14
    );

    bossPosition.x=
      THREE.MathUtils.clamp(
        bossPosition.x,
        -65,
        65
      );

    bossPosition.z=
      THREE.MathUtils.clamp(
        bossPosition.z,
        -65,
        65
      );

    createAnimal(
      6,
      true,
      bossPosition
    );

    message(
      "👑 BOSS TURTLE!",
      "#ff4444"
    );
  }
}

/* =========================================================
   DAY / NIGHT
========================================================= */

function updateWorld(dt){

  worldTime+=
    dt*.35;

  const daylight=
    (Math.sin(worldTime)+1)/2;

  sun.intensity=
    .65+
    daylight*1.5;

  hemi.intensity=
    .8+
    daylight*1.3;

  const targetColor=
    daylight>.3
      ? new THREE.Color(0x86d9ff)
      : new THREE.Color(0x101a45);

  scene.background.lerp(
    targetColor,
    .015
  );
}

/* =========================================================
   CAMERA
========================================================= */

renderer.domElement.addEventListener(
  "mousedown",
  e=>{
    mouseDown=true;
    lastMouseX=e.clientX;
  }
);

addEventListener(
  "mouseup",
  ()=>{
    mouseDown=false;
  }
);

addEventListener(
  "mousemove",
  e=>{

    if(!mouseDown){
      return;
    }

    cameraAngle-=
      (e.clientX-lastMouseX)*
      .006;

    lastMouseX=
      e.clientX;
  }
);

function updateCamera(){

  const target=
    frog.position.clone();

  target.y+=1;

  const distance=
    9+
    state.size*1.4;

  const desired=
    new THREE.Vector3(
      target.x+
        Math.sin(cameraAngle)*
        distance,

      target.y+
        5.5+
        state.size*.3,

      target.z+
        Math.cos(cameraAngle)*
        distance
    );

  camera.position.lerp(
    desired,
    .12
  );

  camera.lookAt(target);
}

/* =========================================================
   KEYBOARD
========================================================= */

addEventListener(
  "keydown",
  e=>{

    const k=
      e.key.toLowerCase();

    keys[k]=true;

    if(e.code==="Space"){

      e.preventDefault();

      attack();
    }

    if(
      k==="e" &&
      !e.repeat
    ){
      ability();
    }
  }
);

addEventListener(
  "keyup",
  e=>{
    keys[
      e.key.toLowerCase()
    ]=false;
  }
);

/*
  Important mobile fix:
  pointercancel and window-level pointerup
  clear movement keys so controls cannot get stuck.
*/

function clearMovementKeys(){

  keys.w=false;
  keys.a=false;
  keys.s=false;
  keys.d=false;
  keys.arrowup=false;
  keys.arrowdown=false;
  keys.arrowleft=false;
  keys.arrowright=false;
}

document.querySelectorAll(
  "[data-key]"
).forEach(button=>{

  const key=
    button.dataset.key;

  button.addEventListener(
    "pointerdown",
    e=>{
      e.preventDefault();
      keys[key]=true;

      try{
        button.setPointerCapture(
          e.pointerId
        );
      }catch(_){}
    }
  );

  const release=e=>{
    e.preventDefault();
    keys[key]=false;
  };

  button.addEventListener(
    "pointerup",
    release
  );

  button.addEventListener(
    "pointercancel",
    release
  );

  button.addEventListener(
    "pointerleave",
    release
  );
});

addEventListener(
  "blur",
  clearMovementKeys
);

document.addEventListener(
  "visibilitychange",
  ()=>{
    if(document.hidden){
      clearMovementKeys();
      mouseDown=false;
    }
  }
);

/* =========================================================
   BUTTONS
========================================================= */

$("attackBtn")
  .addEventListener(
    "click",
    attack
  );

$("healBtn")
  .addEventListener(
    "click",
    heal
  );

$("mutateBtn")
  .addEventListener(
    "click",
    buyMutation
  );

$("rebirthBtn")
  .addEventListener(
    "click",
    rebirth
  );

/* =========================================================
   COOLDOWNS
========================================================= */

function updateCooldowns(dt){

  state.attackCooldown=
    Math.max(
      0,
      state.attackCooldown-dt
    );

  state.abilityCooldown=
    Math.max(
      0,
      state.abilityCooldown-dt
    );

  state.invulnerable=
    Math.max(
      0,
      state.invulnerable-dt
    );
}

/* =========================================================
   STATE VALIDATION
========================================================= */

function validateState(){

  const numericDefaults={
    level:1,
    xp:0,
    coins:0,
    hp:100,
    maxHp:100,
    stamina:100,
    hunger:100,
    size:1,
    speed:.16,
    damage:12,
    rebirths:0,
    kills:0,
    questKills:0,
    questGoal:3,
    attackCooldown:0,
    abilityCooldown:0,
    invulnerable:0,
    score:0
  };

  for(
    const [key,defaultValue]
    of Object.entries(numericDefaults)
  ){

    if(
      !Number.isFinite(
        state[key]
      )
    ){

      state[key]=defaultValue;
    }
  }

  state.level=
    Math.max(
      1,
      Math.floor(state.level)
    );

  state.xp=
    Math.max(0,state.xp);

  state.coins=
    Math.max(0,state.coins);

  state.maxHp=
    Math.max(
      1,
      state.maxHp
    );

  state.hp=
    THREE.MathUtils.clamp(
      state.hp,
      0,
      state.maxHp
    );

  state.stamina=
    THREE.MathUtils.clamp(
      state.stamina,
      0,
      100
    );

  state.hunger=
    THREE.MathUtils.clamp(
      state.hunger,
      0,
      100
    );

  state.size=
    Math.max(
      .1,
      state.size
    );

  state.speed=
    Math.max(
      .01,
      state.speed
    );

  state.damage=
    Math.max(
      1,
      state.damage
    );

  state.questGoal=
    Math.max(
      1,
      Math.min(
        30,
        Math.floor(state.questGoal)
      )
    );
}

/* =========================================================
   MAIN LOOP
========================================================= */

function animate(){

  requestAnimationFrame(
    animate
  );

  const dt=
    Math.min(
      clock.getDelta(),
      .05
    );

  updateCooldowns(dt);

  moveFrog(dt);

  updateAnimals(dt);

  updateParticles(dt);

  updateWorld(dt);

  updateHunger(dt);

  randomEvents(dt);

  updateCamera();

  validateState();

  updateUI();

  renderer.render(
    scene,
    camera
  );
}

/* =========================================================
   RESIZE
========================================================= */

addEventListener(
  "resize",
  ()=>{

    camera.aspect=
      innerWidth/
      innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );
  }
);

/* =========================================================
   START
========================================================= */

validateState();
updateUI();
animate();

</script>

</html>
