<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🐸 Frog Evolution</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #06140b;
    color: white;
}

canvas {
    display: block;
    background: #72c95b;
}

#hud {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 10;

    width: 280px;
    padding: 15px;

    border-radius: 16px;

    background: rgba(10, 25, 15, .85);
    border: 2px solid rgba(255,255,255,.2);

    box-shadow: 0 8px 30px rgba(0,0,0,.4);
}

#title {
    font-size: 22px;
    font-weight: bold;
    color: #8cff5b;
}

#evolution {
    margin-top: 5px;
    font-size: 18px;
}

.bar {
    height: 13px;
    margin-top: 8px;

    background: #172017;
    border-radius: 20px;
    overflow: hidden;
}

#xpBar {
    height: 100%;
    width: 0%;

    background: linear-gradient(
        90deg,
        #00ff88,
        #d6ff00
    );
}

#coins {
    margin-top: 8px;
    color: #ffd84a;
}

#players {
    margin-top: 5px;
    color: #8fdfff;
}

#status {
    margin-top: 8px;
    color: #aaa;
    font-size: 12px;
}

#evolveMessage {
    position: fixed;

    left: 50%;
    top: 50%;

    transform: translate(-50%,-50%);

    z-index: 20;

    display: none;

    font-size: 55px;
    font-weight: bold;

    color: #c8ff5a;

    text-shadow:
        0 0 10px #00ff55,
        0 0 30px #00ff55,
        0 0 60px #fff;

    pointer-events: none;
}

#instructions {
    position: fixed;

    bottom: 15px;
    left: 50%;

    transform: translateX(-50%);

    padding: 10px 18px;

    border-radius: 20px;

    background: rgba(0,0,0,.65);

    color: white;

    z-index: 10;

    font-size: 14px;
}

#connection {
    position: fixed;

    top: 15px;
    right: 15px;

    z-index: 10;

    padding: 10px 14px;

    border-radius: 20px;

    background: rgba(0,0,0,.7);

    font-size: 13px;
}

.connected {
    color: #5cff75;
}

.disconnected {
    color: #ff5252;
}

/* Mobile buttons */

#mobileControls {
    display: none;

    position: fixed;
    bottom: 25px;
    left: 0;

    width: 100%;

    z-index: 30;

    pointer-events: none;
}

.mobileButton {
    pointer-events: auto;

    width: 65px;
    height: 65px;

    margin: 5px;

    border-radius: 50%;

    border: 2px solid white;

    background: rgba(0,0,0,.55);

    color: white;

    font-size: 25px;
}

#mobileLeft {
    margin-left: 20px;
}

@media(max-width:700px) {
    #mobileControls {
        display: flex;
        justify-content: space-between;
    }

    #instructions {
        display: none;
    }

    #hud {
        width: 230px;
        padding: 10px;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
    <div id="title">🐸 FROG EVOLUTION</div>

    <div id="evolution">
        🥚 Egg
    </div>

    <div>
        XP:
        <span id="xpText">0 / 100</span>
    </div>

    <div class="bar">
        <div id="xpBar"></div>
    </div>

    <div id="coins">
        🪙 Coins: 0
    </div>

    <div id="players">
        👥 Players: 1
    </div>

    <div id="status">
        Connecting...
    </div>
</div>

<div id="connection" class="disconnected">
    🔴 Connecting
</div>

<div id="evolveMessage">
    🐸 EVOLVED!
</div>

<div id="instructions">
    WASD / Arrow Keys = Move • Collect 🍎 food to evolve
</div>

<div id="mobileControls">
    <button class="mobileButton" id="mobileLeft">◀</button>
    <button class="mobileButton" id="mobileUp">▲</button>
    <button class="mobileButton" id="mobileDown">▼</button>
    <button class="mobileButton" id="mobileRight">▶</button>
</div>

<script>

/*
============================================================
SERVER SETTINGS
============================================================

For testing on your computer:

ws://localhost:3000

When your multiplayer server is online, change this to:

wss://YOUR-SERVER-DOMAIN.com

GitHub Pages normally uses HTTPS, so a production server
should use WSS instead of WS.
*/

const SERVER_URL = "ws://localhost:3000";


/*
============================================================
CANVAS
============================================================
*/

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();


/*
============================================================
GAME DATA
============================================================
*/

const evolutions = [
    {
        name: "Egg",
        emoji: "🥚",
        required: 0,
        size: 18,
        color: "#eeeeee"
    },
    {
        name: "Tadpole",
        emoji: "🐟",
        required: 100,
        size: 22,
        color: "#4da6ff"
    },
    {
        name: "Tiny Frog",
        emoji: "🐸",
        required: 250,
        size: 27,
        color: "#6bdc45"
    },
    {
        name: "Green Frog",
        emoji: "🐸",
        required: 500,
        size: 34,
        color: "#27b83d"
    },
    {
        name: "Tree Frog",
        emoji: "🐸",
        required: 900,
        size: 42,
        color: "#20e890"
    },
    {
        name: "Poison Frog",
        emoji: "🐸",
        required: 1500,
        size: 50,
        color: "#a855ff"
    },
    {
        name: "Mega Frog",
        emoji: "🐸",
        required: 2500,
        size: 60,
        color: "#ff4d7d"
    },
    {
        name: "King Frog",
        emoji: "👑",
        required: 4000,
        size: 70,
        color: "#ffd23f"
    },
    {
        name: "Cosmic Frog",
        emoji: "🌌",
        required: 6500,
        size: 82,
        color: "#00e5ff"
    },
    {
        name: "Legendary Frog",
        emoji: "🐸",
        required: 10000,
        size: 95,
        color: "#ff7b00"
    }
];


/*
============================================================
LOCAL PLAYER
============================================================
*/

let myPlayer = {
    id: null,

    x: 1500,
    y: 1500,

    xp: 0,
    coins: 0,

    evolution: 0,

    name: "Frog"
};

let otherPlayers = {};

let foods = [];

let worldWidth = 3000;
let worldHeight = 3000;

let cameraX = 0;
let cameraY = 0;


/*
============================================================
KEYBOARD
============================================================
*/

const keys = {};

document.addEventListener("keydown", e => {

    keys[e.key.toLowerCase()] = true;

});

document.addEventListener("keyup", e => {

    keys[e.key.toLowerCase()] = false;

});


/*
============================================================
MOBILE CONTROLS
============================================================
*/

function holdButton(button, key) {

    button.addEventListener("touchstart", e => {

        e.preventDefault();

        keys[key] = true;

    });

    button.addEventListener("touchend", e => {

        e.preventDefault();

        keys[key] = false;

    });
}

holdButton(
    document.getElementById("mobileLeft"),
    "a"
);

holdButton(
    document.getElementById("mobileRight"),
    "d"
);

holdButton(
    document.getElementById("mobileUp"),
    "w"
);

holdButton(
    document.getElementById("mobileDown"),
    "s"
);


/*
============================================================
WEBSOCKET
============================================================
*/

let socket;

function connect() {

    try {

        socket =
            new WebSocket(SERVER_URL);

        socket.onopen = () => {

            document.getElementById(
                "connection"
            ).textContent =
                "🟢 Multiplayer Online";

            document.getElementById(
                "connection"
            ).className =
                "connected";

            document.getElementById(
                "status"
            ).textContent =
                "Connected to multiplayer";

        };


        socket.onclose = () => {

            document.getElementById(
                "connection"
            ).textContent =
                "🔴 Offline";

            document.getElementById(
                "connection"
            ).className =
                "disconnected";

            document.getElementById(
                "status"
            ).textContent =
                "Multiplayer server offline";
        };


        socket.onerror = () => {

            document.getElementById(
                "connection"
            ).textContent =
                "🔴 Connection Error";
        };


        socket.onmessage = event => {

            const data =
                JSON.parse(event.data);

            handleServerMessage(data);
        };

    } catch(error) {

        console.log(error);

    }
}


/*
============================================================
SERVER MESSAGES
============================================================
*/

function handleServerMessage(data) {

    if (data.type === "welcome") {

        myPlayer.id =
            data.id;

    }


    if (data.type === "state") {

        otherPlayers =
            data.players;

        foods =
            data.foods;

        if (data.world) {

            worldWidth =
                data.world.width;

            worldHeight =
                data.world.height;
        }

        updatePlayerCount();
    }
}


/*
============================================================
SEND PLAYER POSITION
============================================================
*/

let networkTimer = 0;

function sendPosition() {

    if (
        !socket ||
        socket.readyState !== WebSocket.OPEN
    ) {
        return;
    }

    networkTimer++;

    if (networkTimer < 3)
        return;

    networkTimer = 0;

    socket.send(
        JSON.stringify({
            type: "move",

            x: myPlayer.x,
            y: myPlayer.y,

            xp: myPlayer.xp,
            coins: myPlayer.coins,

            evolution:
                myPlayer.evolution
        })
    );
}


/*
============================================================
MOVEMENT
============================================================
*/

function movePlayer() {

    let speed =
        5 +
        myPlayer.evolution * .35;

    let dx = 0;
    let dy = 0;

    if (
        keys["a"] ||
        keys["arrowleft"]
    ) {
        dx--;
    }

    if (
        keys["d"] ||
        keys["arrowright"]
    ) {
        dx++;
    }

    if (
        keys["w"] ||
        keys["arrowup"]
    ) {
        dy--;
    }

    if (
        keys["s"] ||
        keys["arrowdown"]
    ) {
        dy++;
    }


    /*
        Normalize diagonal movement
    */

    if (dx !== 0 && dy !== 0) {

        dx *= .707;
        dy *= .707;
    }


    myPlayer.x +=
        dx * speed;

    myPlayer.y +=
        dy * speed;


    /*
        World boundaries
    */

    myPlayer.x =
        Math.max(
            50,
            Math.min(
                worldWidth - 50,
                myPlayer.x
            )
        );

    myPlayer.y =
        Math.max(
            50,
            Math.min(
                worldHeight - 50,
                myPlayer.y
            )
        );


    sendPosition();
}


/*
============================================================
FOOD
============================================================
*/

function distance(a,b) {

    return Math.sqrt(
        (a.x-b.x)**2 +
        (a.y-b.y)**2
    );
}


function collectFood() {

    for (
        let i = foods.length - 1;
        i >= 0;
        i--
    ) {

        let food =
            foods[i];

        if (
            distance(
                myPlayer,
                food
            ) <
            45 +
            evolutions[
                myPlayer.evolution
            ].size
        ) {

            myPlayer.xp +=
                food.value || 10;

            myPlayer.coins +=
                food.coins || 1;

            foods.splice(i,1);

            checkEvolution();

            createParticles(
                food.x,
                food.y,
                "#fff36b",
                10
            );

            if (
                socket &&
                socket.readyState === WebSocket.OPEN
            ) {

                socket.send(
                    JSON.stringify({
                        type: "collect",
                        foodId: food.id
                    })
                );
            }
        }
    }
}


/*
============================================================
EVOLUTION
============================================================
*/

function checkEvolution() {

    let oldEvolution =
        myPlayer.evolution;

    for (
        let i = evolutions.length - 1;
        i >= 0;
        i--
    ) {

        if (
            myPlayer.xp >=
            evolutions[i].required
        ) {

            myPlayer.evolution =
                i;

            break;
        }
    }


    if (
        myPlayer.evolution >
        oldEvolution
    ) {

        showEvolution();

        createParticles(
            myPlayer.x,
            myPlayer.y,
            evolutions[
                myPlayer.evolution
            ].color,
            50
        );
    }
}


function showEvolution() {

    const message =
        document.getElementById(
            "evolveMessage"
        );

    message.textContent =
        "✨ EVOLVED! ✨";

    message.style.display =
        "block";

    setTimeout(() => {

        message.style.display =
            "none";

    }, 1500);
}


/*
============================================================
PARTICLES
============================================================
*/

let particles = [];

function createParticles(
    x,
    y,
    color,
    amount
) {

    for (
        let i=0;
        i<amount;
        i++
    ) {

        particles.push({

            x:x,
            y:y,

            vx:
                (Math.random()-.5)*10,

            vy:
                (Math.random()-.5)*10,

            life:40,

            color:color
        });
    }
}


function updateParticles() {

    for (
        let p of particles
    ) {

        p.x += p.vx;
        p.y += p.vy;

        p.vy += .15;

        p.life--;
    }

    particles =
        particles.filter(
            p => p.life > 0
        );
}


/*
============================================================
CAMERA
============================================================
*/

function updateCamera() {

    cameraX =
        myPlayer.x -
        canvas.width / 2;

    cameraY =
        myPlayer.y -
        canvas.height / 2;

    cameraX =
        Math.max(
            0,
            Math.min(
                worldWidth -
                canvas.width,
                cameraX
            )
        );

    cameraY =
        Math.max(
            0,
            Math.min(
                worldHeight -
                canvas.height,
                cameraY
            )
        );
}


/*
============================================================
WORLD
============================================================
*/

function drawWorld() {

    /*
        Grass
    */

    ctx.fillStyle =
        "#63bd50";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
        Grid / grass pattern
    */

    ctx.strokeStyle =
        "rgba(0,80,30,.12)";

    ctx.lineWidth = 1;

    let grid = 80;

    for (
        let x =
            -cameraX % grid;
        x < canvas.width;
        x += grid
    ) {

        ctx.beginPath();

        ctx.moveTo(x,0);

        ctx.lineTo(
            x,
            canvas.height
        );

        ctx.stroke();
    }

    for (
        let y =
            -cameraY % grid;
        y < canvas.height;
        y += grid
    ) {

        ctx.beginPath();

        ctx.moveTo(0,y);

        ctx.lineTo(
            canvas.width,
            y
        );

        ctx.stroke();
    }


    /*
        Water areas
    */

    drawWater(
        250,
        500,
        500,
        300
    );

    drawWater(
        2100,
        300,
        600,
        400
    );


    /*
        Trees
    */

    for (
        let x=100;
        x<worldWidth;
        x+=220
    ) {

        for (
            let y=120;
            y<worldHeight;
            y+=260
        ) {

            let variation =
                Math.sin(
                    x * .02 +
                    y * .01
                );

            if (
                Math.abs(
                    variation
                ) > .35
            ) {

                drawTree(
                    x,
                    y
                );
            }
        }
    }
}


function drawWater(
    worldX,
    worldY,
    width,
    height
) {

    let x =
        worldX -
        cameraX;

    let y =
        worldY -
        cameraY;

    ctx.fillStyle =
        "#38a9dc";

    ctx.beginPath();

    ctx.roundRect(
        x,
        y,
        width,
        height,
        80
    );

    ctx.fill();


    ctx.strokeStyle =
        "rgba(255,255,255,.25)";

    ctx.lineWidth = 4;

    for (
        let i=0;
        i<5;
        i++
    ) {

        ctx.beginPath();

        ctx.moveTo(
            x+40,
            y+50+i*50
        );

        ctx.quadraticCurveTo(
            x+width/2,
            y+20+i*50,
            x+width-40,
            y+50+i*50
        );

        ctx.stroke();
    }
}


function drawTree(
    worldX,
    worldY
) {

    let x =
        worldX -
        cameraX;

    let y =
        worldY -
        cameraY;

    ctx.fillStyle =
        "#70452a";

    ctx.fillRect(
        x-10,
        y,
        20,
        65
    );

    ctx.fillStyle =
        "#19733a";

    ctx.beginPath();

    ctx.arc(
        x,
        y-10,
        45,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle =
        "#2d9147";

    ctx.beginPath();

    ctx.arc(
        x-25,
        y+5,
        30,
        0,
        Math.PI*2
    );

    ctx.arc(
        x+25,
        y+5,
        30,
        0,
        Math.PI*2
    );

    ctx.fill();
}


/*
============================================================
DRAW FOOD
============================================================
*/

function drawFood(food) {

    let x =
        food.x -
        cameraX;

    let y =
        food.y -
        cameraY;

    ctx.font = "25px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.shadowColor =
        "#ffff66";

    ctx.shadowBlur = 15;

    ctx.fillText(
        food.type || "🍎",
        x,
        y
    );

    ctx.shadowBlur = 0;
}


/*
============================================================
DRAW FROG
============================================================
*/

function drawFrog(
    player,
    isMe
) {

    let evolution =
        evolutions[
            player.evolution || 0
        ];

    let x =
        player.x -
        cameraX;

    let y =
        player.y -
        cameraY;

    let size =
        evolution.size;


    /*
        Shadow
    */

    ctx.fillStyle =
        "rgba(0,0,0,.25)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y+size*.55,
        size,
        size*.3,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
        Glow
    */

    ctx.shadowColor =
        evolution.color;

    ctx.shadowBlur =
        isMe ? 20 : 10;


    /*
        Body
    */

    ctx.fillStyle =
        evolution.color;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        size,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
        Eyes
    */

    ctx.fillStyle =
        "#fff";

    ctx.beginPath();

    ctx.arc(
        x-size*.4,
        y-size*.65,
        size*.3,
        0,
        Math.PI*2
    );

    ctx.arc(
        x+size*.4,
        y-size*.65,
        size*.3,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle =
        "#111";

    ctx.beginPath();

    ctx.arc(
        x-size*.4,
        y-size*.65,
        size*.11,
        0,
        Math.PI*2
    );

    ctx.arc(
        x+size*.4,
        y-size*.65,
        size*.11,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
        Mouth
    */

    ctx.strokeStyle =
        "#183b16";

    ctx.lineWidth = 3;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        size*.45,
        .15,
        Math.PI-.15
    );

    ctx.stroke();


    /*
        Special evolution effects
    */

    if (
        player.evolution >= 5
    ) {

        ctx.strokeStyle =
            evolution.color;

        ctx.lineWidth = 3;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            size+8+
            Math.sin(
                Date.now()/150
            )*4,
            0,
            Math.PI*2
        );

        ctx.stroke();
    }


    /*
        King crown
    */

    if (
        player.evolution === 7
    ) {

        ctx.font =
            `${size}px Arial`;

        ctx.fillText(
            "👑",
            x,
            y-size-5
        );
    }


    /*
        Name
    */

    ctx.shadowBlur = 0;

    ctx.fillStyle =
        "white";

    ctx.font =
        "bold 13px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        isMe
            ? "YOU"
            : player.name ||
              "Frog",
        x,
        y-size-25
    );
}


/*
============================================================
DRAW OTHER PLAYERS
============================================================
*/

function drawOtherPlayers() {

    for (
        const id in otherPlayers
    ) {

        if (
            id === myPlayer.id
        )
            continue;

        const player =
            otherPlayers[id];

        drawFrog(
            player,
            false
        );
    }
}


/*
============================================================
HUD
============================================================
*/

function updateHUD() {

    let evolution =
        evolutions[
            myPlayer.evolution
        ];

    document.getElementById(
        "evolution"
    ).textContent =
        evolution.emoji +
        " " +
        evolution.name;


    let next =
        evolutions[
            myPlayer.evolution + 1
        ];


    if (!next) {

        document.getElementById(
            "xpText"
        ).textContent =
            "MAX";

        document.getElementById(
            "xpBar"
        ).style.width =
            "100%";

    } else {

        let previous =
            evolution.required;

        let needed =
            next.required -
            previous;

        let current =
            myPlayer.xp -
            previous;

        let percentage =
            Math.max(
                0,
                Math.min(
                    100,
                    current /
                    needed *
                    100
                )
            );

        document.getElementById(
            "xpText"
        ).textContent =
            myPlayer.xp +
            " / " +
            next.required;

        document.getElementById(
            "xpBar"
        ).style.width =
            percentage + "%";
    }


    document.getElementById(
        "coins"
    ).textContent =
        "🪙 Coins: " +
        myPlayer.coins;
}


function updatePlayerCount() {

    let count =
        Object.keys(
            otherPlayers
        ).length;

    document.getElementById(
        "players"
    ).textContent =
        "👥 Players: " +
        Math.max(
            1,
            count
        );
}


/*
============================================================
GAME LOOP
============================================================
*/

function update() {

    movePlayer();

    collectFood();

    updateParticles();

    updateCamera();

    updateHUD();
}


function draw() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawWorld();


    /*
        Food
    */

    for (
        let food of foods
    ) {

        drawFood(food);
    }


    /*
        Other players
    */

    drawOtherPlayers();


    /*
        Our frog
    */

    drawFrog(
        myPlayer,
        true
    );


    /*
        Particles
    */

    for (
        let p of particles
    ) {

        let x =
            p.x -
            cameraX;

        let y =
            p.y -
            cameraY;

        ctx.globalAlpha =
            p.life / 40;

        ctx.fillStyle =
            p.color;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            4,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.globalAlpha = 1;
    }
}


function loop() {

    update();

    draw();

    requestAnimationFrame(
        loop
    );
}


/*
============================================================
START
============================================================
*/

connect();

loop();

</script>

</body>
</html>
